<!DOCTYPE html>

</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">

    <nav style="background-color: #e3f2fd; padding: 10px; margin-bottom: 20px;">
        <strong>Menú: </strong>

    <div th:if="${listaStack != null}">

        <ul><li th:each="item : ${listaStack}" th:text="${item}"></li></ul>

    <div th:if="${listaDeque != null}">
        <h4>Desde Iterator (Deque):</h4>
        <ul><li th:each="item : ${listaDeque}" th:text="${item}"></li></ul>
    </div>

    <ul th:if="${listaResultados != null}">
        <li th:each="item : ${listaResultados}" th:text="${item}"></li>
    </ul>
